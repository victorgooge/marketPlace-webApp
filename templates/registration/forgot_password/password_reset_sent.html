{% extends "registration/forgot_password/_base.html" %}
{% block title %}Email Sent — MarketPlace{% endblock %}

{% block auth_content %}

    <div style="font-size: 2.5rem; margin-bottom: 1rem;">📧</div>
    <h1 style="font-size: 1.4rem;">Check your inbox</h1>
    <p class="sub" style="margin-top: 0.5rem;">

    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="margin-top: 1rem;">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
  </div>
{% endblock %}
