{% extends "registration/forgot_password/_base.html" %}
{% block title %}Reset Password — MarketPlace{% endblock %}

{% block auth_content %}
  <h1>Reset Password</h1>
  <p class="sub">Enter your email and we'll send you a reset link.</p>

  <form method="POST" action="">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Email Address</label>
      {{ form }}
    </div>
    <input type="submit" value="Send Reset Email">
  </form>

  <div class="auth-footer">
    <a href="{% url 'login' %}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  </div>
{% endblock %}
