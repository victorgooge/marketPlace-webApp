{% extends "registration/forgot_password/_base.html" %}
{% block title %}Password Reset Complete — MarketPlace{% endblock %}

{% block auth_content %}
  <div style="text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">✅</div>
    <h1 style="font-size: 1.4rem;">Password updated!</h1>
    <p class="sub" style="margin-top: 0.5rem;">Your new password has been set. You can now log in.</p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="margin-top: 1rem;">
      <i class="fa-solid fa-right-to-bracket"></i> Log In
    </a>
  </div>
{% endblock %}
